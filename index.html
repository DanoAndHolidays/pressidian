<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Applies on the first paint, before Vite's bundled CSS is even requested. -->
    <link rel="stylesheet" href="%BASE_URL%brand/loading.css" />
    <!--
      The pixel faces are *not* preloaded here. They live in `src/assets`, so
      Vite content-hashes them and a hand-written href in this file would 404.
      `font-display: swap` plus a monospace fallback that shares the same 1ch
      grid keeps the boot terminal from reflowing when they land.
    -->
    <meta name="theme-color" content="#05070a" />
    <meta name="author" content="Dano" />
    <meta
      name="description"
      content="Pressidian — Dano 的前端作品与数字花园：项目、经历，以及持续生长的 Obsidian 技术笔记。"
    />
    <title>Pressidian · Dano 的数字花园</title>
    <script>
      // Resolve the colour scheme before first paint so the paper never flashes.
      ;(() => {
        try {
          const stored = localStorage.getItem('pressidian-theme')
          const dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          /* private mode — fall back to the light palette */
        }
      })()
    </script>
  </head>
  <body>
    <!--
      Pre-JavaScript boot screen.

      It deliberately reproduces the first frame of `BootSequence.vue` — same
      near-black field, same green terminal lines, same frame geometry — so the
      handover from static HTML to the Vue sequence is invisible. It is not a
      second animation: it types nothing and advances nothing, because two
      competing timelines would fight at the seam.
    -->
    <div id="garden-boot" class="pboot" role="status" aria-live="polite" aria-label="正在启动 Pressidian">
      <div class="pboot__console">
        <div class="pboot__frame">
          <div class="pboot__bar">
            <span class="pboot__dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="pboot__label">pressidian — secure boot</span>
            <span class="pboot__label pboot__clock">000%</span>
          </div>
          <div class="pboot__lines">
            <p>&gt; PRESSIDIAN BIOS v2.0 — (c) DANO LABS</p>
            <p>&gt; scene renderer ......................... OK</p>
            <p id="garden-boot-label" class="pboot__pending">
              &gt; vault index ............................ <span class="pboot__spin"></span>
            </p>
          </div>
          <div class="pboot__meter">
            <div class="pboot__track"><span class="pboot__fill"></span></div>
            <span class="pboot__label">decrypting garden · 000%</span>
          </div>
        </div>
        <div class="pboot__actions">
          <span class="pboot__label pboot__hint">自动登录中 · 按任意键跳过</span>
          <a id="garden-boot-retry" class="pboot__retry" href="" hidden>重新加载</a>
        </div>
      </div>
      <div class="pboot__scan" aria-hidden="true"></div>
    </div>
    <div id="app" inert></div>
    <noscript>
      <style>#garden-boot { display: none; }</style>
      <p>🦊 请启用 JavaScript，打开 Dano 的数字花园。</p>
    </noscript>
    <script>
      ;(() => {
        const screen = document.getElementById('garden-boot')
        const root = document.getElementById('app')
        const label = document.getElementById('garden-boot-label')
        const retry = document.getElementById('garden-boot-retry')
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
        let failed = false
        let dismissed = false
        let timeout
        document.documentElement.setAttribute('data-booting', '')

        retry.addEventListener('click', (event) => {
          event.preventDefault()
          window.location.reload()
        })

        const dismiss = () => {
          if (failed || dismissed) return
          dismissed = true
          clearTimeout(timeout)
          document.documentElement.removeAttribute('data-booting')
          root.removeAttribute('inert')
          screen.classList.add('is-ready')
          // A short cross-fade, not an instant cut: the Vue boot overlay is
          // already painted underneath with the same layout, so the two blend
          // into one continuous screen.
          setTimeout(() => screen.remove(), reducedMotion.matches ? 0 : 220)
        }

        const onError = () => {
          failed = true
          clearTimeout(timeout)
          label.textContent = '> 启动失败 — 花园暂时没能打开。'
          label.classList.add('is-error')
          retry.hidden = false
          screen.classList.add('has-error')
        }

        // Vite rewrites the entry script, so module failures surface here.
        const onResourceError = (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') onError()
        }
        window.addEventListener('error', onResourceError, true)
        window.addEventListener('pressidian:boot-error', onError, { once: true })

        window.addEventListener(
          'pressidian:ready',
          () => {
            if (failed) return
            clearTimeout(timeout)
            window.removeEventListener('error', onResourceError, true)
            dismiss()
          },
          { once: true },
        )

        // A stalled bundle must not leave the reader on a dead screen forever.
        timeout = window.setTimeout(() => {
          label.textContent = '> 加载时间有点久，可以重新打开试试。'
          label.classList.remove('pboot__pending')
          retry.hidden = false
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
