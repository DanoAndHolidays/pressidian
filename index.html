<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/pressidian/favicon.svg" />
    <!--
      The overlay must own the viewport even before external CSS arrives. The
      root starts dark to match the default theme, so the first paint is never
      the light canvas; the inline script below removes `dark` only when the
      visitor has explicitly chosen light.
    -->
    <style>
      html { background: #1d1b19; color-scheme: dark; }
      html:not(.dark) { background: #f4f1ea; color-scheme: light; }
      #garden-boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; width: 100%; height: 100%; box-sizing: border-box; margin: 0; padding: 24px; background: #1d1b19; }
      html:not(.dark) #garden-boot { background: #f4f1ea; }
      #garden-boot-signature { display: block; width: min(330px, 72vw); height: auto; }
      html[data-booting], html[data-booting] body { overflow: hidden; }
    </style>
    <meta name="theme-color" content="#1d1b19" />
    <meta name="author" content="Dano" />
    <meta
      name="description"
      content="Pressidian — Dano 的前端作品与数字花园：项目、经历，以及持续生长的 Obsidian 技术笔记。"
    />
    <title>Pressidian · Dano 的数字花园</title>
    <script>
      /*
       * Resolve the colour scheme before first paint so the page never flashes.
       *
       * The default is dark, NOT the OS preference: the site ships a dark
       * identity and only switches when the visitor has actually chosen a theme
       * with the toggle. Following `prefers-color-scheme` here meant a visitor on
       * a light-mode OS never saw the intended look at all.
       */
      ;(() => {
        try {
          const stored = localStorage.getItem('pressidian-theme')
          const dark = stored !== 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          /* private mode — keep the dark default */
        }
      })()
    </script>
    <script type="module" crossorigin src="/pressidian/assets/index-B_zGZbkW.js"></script>
    <link rel="stylesheet" crossorigin href="/pressidian/assets/index-DXaMGqxK.css">
  </head>
  <body>
    <!--
      The boot screen carries no copy of its own: just the hand-written
      signature and its conveyor loader. The status paragraph sits empty and
      hidden until a timeout or a load failure has something real to report, so
      nothing is written below the loader on the normal path.

      The loader is plain markup rather than the Vue `ConveyorLoop`, because this
      screen has to draw before any component code has been parsed. Its CSS lives
      in `src/styles/loading.css`; keep the two in step.
    -->
    <div id="garden-boot" class="garden-loading" role="status" aria-live="polite" aria-label="正在打开数字花园">
      <img id="garden-boot-signature" class="garden-loading__signature" src="/pressidian/assets/dano-loading-C-h41ROP.svg" width="330" height="172" alt="Dano 钢笔手写签名" fetchpriority="high" />
      <div class="garden-loading__line" aria-hidden="true">
        <span class="garden-loading__track">░░░░░░░░░░</span>
        <span class="garden-loading__block" style="--loader-index: 0">█</span>
        <span class="garden-loading__block" style="--loader-index: 1">▓</span>
        <span class="garden-loading__block" style="--loader-index: 2">▒</span>
      </div>
      <p id="garden-boot-label" class="garden-loading__label" hidden></p>
      <a id="garden-boot-retry" class="garden-loading__retry" href="" hidden>重新加载</a>
    </div>
    <div id="app" inert></div>
    <noscript>
      <style>#garden-boot { display: none; }</style>
      <p>🦊 请启用 JavaScript，打开 Dano 的数字花园。</p>
    </noscript>
    <script>
      ;(() => {
        const screen = document.getElementById('garden-boot')
        const root = document.getElementById('app')
        const label = document.getElementById('garden-boot-label')
        const retry = document.getElementById('garden-boot-retry')
        const signature = document.getElementById('garden-boot-signature')
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
        let signatureFinished = reducedMotion.matches
        let appReady = false
        let dismissed = false
        let signatureTimer
        let signatureFallback
        let timeout
        document.documentElement.setAttribute('data-booting', '')
        retry.addEventListener('click', (event) => {
          event.preventDefault()
          window.location.reload()
        })
        let failed = false
        const dismissWhenReady = () => {
          if (failed || dismissed || !appReady || !signatureFinished) return
          dismissed = true
          clearTimeout(timeout)
          clearTimeout(signatureTimer)
          clearTimeout(signatureFallback)
          reducedMotion.removeEventListener('change', onMotionPreference)
          document.documentElement.removeAttribute('data-booting')
          root.removeAttribute('inert')
          screen.classList.add('is-ready')
          setTimeout(() => screen.remove(), reducedMotion.matches ? 0 : 420)
        }
        const finishSignature = () => {
          signatureFinished = true
          dismissWhenReady()
        }
        const onMotionPreference = () => {
          if (reducedMotion.matches) finishSignature()
        }
        reducedMotion.addEventListener('change', onMotionPreference)
        const startSignature = () => {
          clearTimeout(signatureFallback)
          // 2710ms of pen strokes, followed by a short hold on the finished ink.
          signatureTimer = setTimeout(finishSignature, reducedMotion.matches ? 0 : 3120)
        }
        const recoverSignature = () => {
          signature.src = '/pressidian/brand/dano-logo.png'
          finishSignature()
        }
        // A stalled image request must not indefinitely block a ready app.
        signatureFallback = setTimeout(finishSignature, 4500)
        signature.addEventListener('error', recoverSignature, { once: true })
        if (signature.complete) {
          if (signature.naturalWidth) startSignature()
          else recoverSignature()
        } else signature.addEventListener('load', startSignature, { once: true })
        const showRecovery = () => {
          label.textContent = '加载时间有点久，可以试试重新打开。'
          label.hidden = false
          retry.hidden = false
        }
        timeout = window.setTimeout(showRecovery, 12000)
        const onError = () => {
          failed = true
          clearTimeout(timeout)
          clearTimeout(signatureTimer)
          clearTimeout(signatureFallback)
          reducedMotion.removeEventListener('change', onMotionPreference)
          label.textContent = '花园暂时没能打开，请重新加载。'
          label.hidden = false
          retry.hidden = false
          screen.classList.add('has-error')
        }
        // Vite rewrites the entry script, so observe module failures here.
        const onResourceError = (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') onError()
        }
        window.addEventListener('error', onResourceError, true)
        window.addEventListener('pressidian:boot-error', onError, { once: true })

        /*
         * Self-healing upgrade.
         *
         * GitHub Pages serves everything through Fastly with a fixed
         * `Cache-Control: max-age=600` on HTML (`index.html` here reports
         * `Via: 1.1 varnish`), and Pages does not let a site override response
         * headers. So a browser can keep serving a cached `index.html` that
         * points at asset hashes from an older build. The app still boots — it
         * is a complete, working bundle — so nothing looks broken; it just
         * silently serves stale code, which is exactly how a deploy can appear
         * not to have happened.
         *
         * The fix is to stop trusting that cached HTML. Once the app is up,
         * fetch the live `index.html` with `no-store` (bypassing both the local
         * cache and Fastly) and compare its entry-script hash against the one
         * this page actually loaded. A mismatch means this tab is running an
         * old build, so reload once to pick up the new one.
         *
         * `sessionStorage` guards against a reload loop: if the fresh copy still
         * disagrees, or the network is unreachable, the tab settles on whatever
         * it has rather than reloading forever. The flag is per-tab rather than
         * per-tab-per-build so a long-lived tab cannot end up in a cycle.
         */
        const checkForNewBuild = () => {
          try {
            if (sessionStorage.getItem('pressidian-build-check')) return
            sessionStorage.setItem('pressidian-build-check', '1')
          } catch {
            /* private mode — checking is still safe, we just cannot guard */
          }
          const running = document.querySelector('script[type="module"][src]')
          if (!running) return
          const runningUrl = new URL(running.src)
          const currentBuild = runningUrl.pathname.split('/').pop()
          /*
           * Resolve `index.html` against the deployed base, not against the
           * script's own folder: `new URL('index.html', running.src)` would give
           * `/pressidian/assets/index.html`, and Pages would answer with the
           * SPA fallback (this same document), so the check would compare a
           * build against itself and never fire. Strip `/assets/` first.
           */
          const assetsAt = runningUrl.pathname.lastIndexOf('/assets/')
          const base = assetsAt === -1
            ? runningUrl.pathname.slice(0, runningUrl.pathname.lastIndexOf('/') + 1)
            : runningUrl.pathname.slice(0, assetsAt + 1)
          const indexUrl = runningUrl.origin + base + 'index.html'
          fetch(indexUrl, { cache: 'no-store' })
            .then((response) => (response.ok ? response.text() : ''))
            .then((markup) => {
              const match = markup.match(/<script[^>]+type="module"[^>]+src="([^"]+)"/)
              if (!match) return
              if (match[1].split('/').pop() !== currentBuild) window.location.reload()
            })
            .catch(() => {
              /* offline or blocked — keep the bundle we already have */
            })
        }

        window.addEventListener('pressidian:ready', () => {
          if (failed) return
          clearTimeout(timeout)
          window.removeEventListener('error', onResourceError, true)
          window.removeEventListener('pressidian:boot-error', onError)
          appReady = true
          dismissWhenReady()
          checkForNewBuild()
        }, { once: true })
      })()
    </script>
  </body>
</html>
