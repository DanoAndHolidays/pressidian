name: Sync notes and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Shanghai
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pressidian
        uses: actions/checkout@v4

      - name: Checkout Obsidian vault
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OBSIDIAN_REPOSITORY || 'DanoAndHolidays/ObsidianSave' }}
          token: ${{ secrets.OBSIDIAN_TOKEN || github.token }}
          path: .obsidian-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Obsidian notes
        run: npm run sync:obsidian -- --source .obsidian-source

      - name: Build site
        run: npm run docs:build
        env:
          BASE_PATH: /pressidian/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vuepress/dist
          clean: true
